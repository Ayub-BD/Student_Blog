<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Users - Study Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h2 {
            font-size: 1.5rem;
            color: #1e293b;
        }

        .back-link {
            text-decoration: none;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0f172a;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .search-btn:hover {
            background-color: #1d4ed8;
        }

        .results-section h3 {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }

        .user-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .username {
            font-weight: 600;
            color: #334155;
        }

        .chat-btn {
            background-color: #10b981;
            color: #ffffff;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .chat-btn:hover {
            background-color: #059669;
        }

        .no-results {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Find Users</h2>
            <a href="{% url 'index' %}" class="back-link">← Home</a>
        </div>
        
        <form method="GET" action="{% url 'search_users' %}" class="search-form">
            <input type="text" name="q" value="{{ query }}" placeholder="Search by username..." class="search-input" required>
            <button type="submit" class="search-btn">Search</button>
        </form>

        {% if query %}
            <div class="results-section">
                <h3>Results for "{{ query }}"</h3>
                {% if results %}
                    <div class="user-list">
                        {% for u in results %}
                            <div class="user-card">
                                <div class="user-info">
                                    <div class="avatar">{{ u.username|first }}</div>
                                    <span class="username">{{ u.username }}</span>
                                </div>
                                <a href="{% url 'chat_user' u.username %}" class="chat-btn">💬 Chat</a>
                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <p class="no-results">No users found matching "{{ query }}".</p>
                {% endif %}
            </div>
        {% endif %}
    </div>

</body>
</html>
