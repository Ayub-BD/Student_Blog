<!doctype html>
<html>
  <head>
    <title>Login</title>
  </head>
  <style>
    * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f1f1f1;
      }

      h1 {
        text-align: center;
      }

      form {
        background-color: white;
        padding: 20px;
        border-radius: 6px;
        max-width: 400px;
        margin: auto;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 5px 0 15px 0;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }

      p {
        text-align: center;
      }
    </style>
  </style>

  <body>
    <h1>Login</h1>

    <form method="POST">
      {% csrf_token %} {{ form.as_p }}

      <button type="submit">Login</button>
    </form>

    <p>
      Don't have an account?
      <a href="{% url 'register' %}"> Register </a>
    </p>
  </body>
</html>
